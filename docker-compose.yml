services:
  ollama:
    image: ollama/ollama:latest
    container_name: assist-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  assist:
    build: .
    container_name: assist-api
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-hermes3:8b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      USE_PGVECTOR: ${USE_PGVECTOR:-true}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PUBLIC_UI_BASE_URL: ${PUBLIC_UI_BASE_URL:-https://assist-brief.vercel.app}
    restart: unless-stopped

volumes:
  ollama_data:
