<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>assist — 일일 개발 기술 동향 브리핑</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131b2e;
      --surface-hover: #1a2540;
      --border: #263354;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --badge-bg: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 72px;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }
    .brand {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .card-title {
      margin: 0 0 14px;
      font-size: 1.3rem;
    }
    .card-title a {
      color: var(--text);
      text-decoration: none;
    }
    .summary-list {
      margin: 0 0 18px;
      padding-left: 20px;
      color: #cbd5e1;
      font-size: 0.96rem;
    }
    .summary-list li {
      margin-bottom: 6px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .badge {
      font-size: 0.78rem;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .read-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--accent);
      text-decoration: none;
    }
    .read-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span class="brand" style="margin-bottom: 0;">DomAssistBot · Tech Trend Digest</span>
        <a href="/admin" style="color: var(--muted); text-decoration: none; font-size: 0.82rem; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; transition: color 0.15s;">B2B Console ↗</a>
      </div>
      <h1>일일 개발 기술 동향 아티클</h1>
      <p class="subtitle">AI 에이전트/LLM · 풀스택 웹(React, Next.js, NestJS) · 인프라/DevOps 핵심 3줄 요약 및 원문 아티클 아카이브</p>
    </header>
    <main id="article-list">
      <p style="color: var(--muted);">브리핑 목록을 불러오는 중입니다...</p>
    </main>
  </div>
  <script>
    async function loadArticles() {
      const container = document.getElementById("article-list");
      try {
        const res = await fetch("/data/articles.json");
        const data = await res.json();
        const articles = data.articles || [];
        container.textContent = "";
        if (!articles.length) {
          const empty = document.createElement("p");
          empty.textContent = "등록된 브리핑 아티클이 없습니다.";
          container.appendChild(empty);
          return;
        }
        articles.forEach((article) => {
          const card = document.createElement("article");
          card.className = "card";

          const meta = document.createElement("div");
          meta.className = "card-meta";
          const dateSpan = document.createElement("span");
          dateSpan.textContent = `📅 ${article.date}`;
          meta.appendChild(dateSpan);
          card.appendChild(meta);

          const h2 = document.createElement("h2");
          h2.className = "card-title";
          const titleLink = document.createElement("a");
          titleLink.href = `/articles/${encodeURIComponent(article.slug)}`;
          titleLink.textContent = article.title;
          h2.appendChild(titleLink);
          card.appendChild(h2);

          const ol = document.createElement("ol");
          ol.className = "summary-list";
          (article.summary_lines || []).slice(0, 3).forEach((line) => {
            const li = document.createElement("li");
            li.textContent = line;
            ol.appendChild(li);
          });
          card.appendChild(ol);

          const badges = document.createElement("div");
          badges.className = "badges";
          (article.sections || []).forEach((sec) => {
            const b = document.createElement("span");
            b.className = "badge";
            b.textContent = `${sec.domain_label} (${(sec.items || []).length})`;
            badges.appendChild(b);
          });
          card.appendChild(badges);

          const link = document.createElement("a");
          link.className = "read-link";
          link.href = `/articles/${encodeURIComponent(article.slug)}`;
          link.textContent = "상세 아티클 및 원문 링크 보기 →";
          card.appendChild(link);

          container.appendChild(card);
        });
      } catch (err) {
        container.textContent = "아티클 데이터를 불러오지 못했습니다.";
      }
    }
    loadArticles();
  </script>
</body>
</html>
