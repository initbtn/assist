services:
  assist:
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: "false"
    image: assist:latest
    container_name: assist-api
    ports:
      - "8001:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-gemma3:12b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-Snowflake/snowflake-arctic-embed-l-v2.0}
      USE_PGVECTOR: ${USE_PGVECTOR:-false}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PUBLIC_UI_BASE_URL: ${PUBLIC_UI_BASE_URL:-https://assist-brief.vercel.app}
    mem_limit: 256m
    restart: unless-stopped

  assist-bot:
    image: assist:latest
    container_name: assist-bot
    depends_on:
      - assist
    command: ["python", "scripts/run_telegram_polling.py"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-gemma3:12b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-Snowflake/snowflake-arctic-embed-l-v2.0}
      USE_PGVECTOR: ${USE_PGVECTOR:-false}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PUBLIC_UI_BASE_URL: ${PUBLIC_UI_BASE_URL:-https://assist-brief.vercel.app}
    mem_limit: 128m
    restart: unless-stopped
